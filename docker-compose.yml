version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsb
      POSTGRES_PASSWORD: dsb
      POSTGRES_DB: deriv_signal_bot
    ports:
      - "5432:5432"
    volumes:
      - dsb_pgdata:/var/lib/postgresql/data

volumes:
  dsb_pgdata:
